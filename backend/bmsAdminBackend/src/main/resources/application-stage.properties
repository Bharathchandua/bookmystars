##########################################################
# BookMyStars - Staging Environment Configuration
##########################################################

server.port=${PORT:8080}

# Staging Database (Overridable via DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookmystars_stage}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Bharath@7579.}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Staging JWT Authentication
jwt.secret=${JWT_SECRET:BookMyStarsStageSecretKeyForJwtAuthentication2026VerySecure}
jwt.expiration=86400000

# Actuator Health
management.endpoint.health.show-details=never

# Logging
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO
