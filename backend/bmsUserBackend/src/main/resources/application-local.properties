##########################################################
# BookMyStars - Local Development Environment Configuration
##########################################################

server.port=8080

# Local PostgreSQL Database (Can be overridden via environment variables)
spring.datasource.url=${BMS_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/bookmystars}}
spring.datasource.username=${BMS_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${BMS_DB_PASSWORD:${DB_PASSWORD:Bharath@7579.}}

# JPA / Hibernate for Local Development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local JWT Authentication Secret
jwt.secret=BookMyStarsSecretKeyForJwtAuthentication2026VerySecure
jwt.expiration=86400000

# Actuator Health (Detailed info for local debugging)
management.endpoint.health.show-details=always

# Local CORS & Seed Flag
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5170,http://localhost:8080,http://localhost:8081
app.seed-demo-data=true

# Local SQL & Diagnostic Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
