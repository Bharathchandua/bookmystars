##########################################################
# BookMyStars - Production Environment Configuration
##########################################################

server.port=${PORT:8080}

# Production Database (Embedded credentials with environment variable override support)
spring.datasource.url=${BMS_DB_URL:${DB_URL:jdbc:postgresql://sqldb:5432/bookmystarsdb}}
spring.datasource.username=${BMS_DB_USERNAME:${DB_USERNAME:webadmin}}
spring.datasource.password=${BMS_DB_PASSWORD:${DB_PASSWORD:NmbDhxe8xb}}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production JWT Security
jwt.secret=${JWT_SECRET:BookMyStarsSecretKeyForJwtAuthentication2026VerySecure}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Production Error Masking (Never expose internal stack traces, exceptions, or schemas to clients)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Actuator Health Security (Never expose internal system details in production)
management.endpoint.health.show-details=never
management.endpoints.jmx.exposure.exclude=*

# Production Security & Flexible CORS (Supports Netlify, Vercel, localhost, and custom domains)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.seed-demo-data=false

# Production Logging Optimization (Minimizes disk I/O while preserving errors and audit logs)
logging.level.root=INFO
logging.level.com.example.bookmystars=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
