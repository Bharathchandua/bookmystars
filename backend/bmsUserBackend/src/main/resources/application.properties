spring.application.name=bms-user-backend

# Active Profile Selection
# Defaults to 'prod' for standalone / cloud WAR deployment so it runs out-of-the-box
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.profiles.default=prod

# Production Database Credentials embedded for zero-config CloudJiffy deployment
spring.datasource.url=${BMS_DB_URL:${DB_URL:jdbc:postgresql://sqldb:5432/bookmystarsdb}}
spring.datasource.username=${BMS_DB_USERNAME:${DB_USERNAME:webadmin}}
spring.datasource.password=${BMS_DB_PASSWORD:${DB_PASSWORD:NmbDhxe8xb}}

# HikariCP Connection Pool Settings (Enterprise standard)
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000

# PostgreSQL Driver & Hibernate Dialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Bean Overriding
spring.main.allow-bean-definition-overriding=true

# Multipart File Upload Limits (Photos, Headshots, Audition Videos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Reverse Proxy / Cloud Load Balancer Support (Nginx, Cloudflare, AWS ALB, CloudJiffy)
server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for

# Error Response Formatting
server.error.include-message=always
server.error.include-binding-errors=always

# Swagger / OpenAPI UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Actuator Health & Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.info.env.enabled=false

# Security & CORS Configuration
cors.allowed-origins=*
app.seed-demo-data=false

# Structured Logging Configuration (Managed by logback-spring.xml)
logging.file.path=logs
logging.level.root=INFO
logging.level.com.example.bookmystars=INFO
logging.level.org.springframework.web=INFO
